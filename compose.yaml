name: pharmamate

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the project .env file}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PHARMAMATE_MODEL: ${PHARMAMATE_MODEL:-gpt-4o-mini}
      PHARMAMATE_EMBEDDING_MODEL: ${PHARMAMATE_EMBEDDING_MODEL:-text-embedding-3-small}
      PHARMAMATE_DATA_DIR: /data
    ports:
      - "127.0.0.1:${PHARMAMATE_API_PORT:-8000}:8000"
    volumes:
      - pharmamate_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHARMAMATE_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pharmamate_data:
